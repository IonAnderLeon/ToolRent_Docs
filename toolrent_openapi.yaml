      tags: [Invoices]
      summary: Replace an invoice
      operationId: replaceInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceUpdate'
      responses:
        '200':
          description: Replaced invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Invoices]
      summary: Delete an invoice
      operationId: deleteInvoice
      responses:
        '204':
          description: Invoice deleted
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ToolId:
      name: toolId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InventoryId:
      name: inventoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VendorId:
      name: vendorId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClientId:
      name: clientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RentalId:
      name: rentalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RentalItemId:
      name: rentalItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Unauthorized:
      description: Authentication is required or the token is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
  schemas:
    Uuid:
      type: string
      format: uuid
    Money:
      type: number
      format: double
      minimum: 0
      example: 24.5
    Coordinates:
      type: object
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
    User:
      type: object
      required: [id, username, email, role]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        username: { type: string, minLength: 3, maxLength: 100 }
        email: { type: string, format: email }
        role:
          type: string
          enum: [client, vendor, admin]
        createdAt: { type: string, format: date-time }
    UserWrite:
      type: object
      required: [username, email, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, format: password }
        role: { type: string, enum: [client, vendor, admin] }
    RegisterRequest:
      type: object
      required: [username, email, password, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, format: password }
        role: { type: string, enum: [client, vendor] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    AuthResponse:
      type: object
      required: [accessToken, tokenType, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Token lifetime in seconds }
        user: { $ref: '#/components/schemas/User' }
    Client:
      type: object
      required: [id, userId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        nif: { type: string, maxLength: 30 }
        phone: { type: string, maxLength: 30 }
        address: { type: string, maxLength: 255 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
    ClientWrite:
      type: object
      properties:
        nif: { type: string, maxLength: 30 }
        phone: { type: string, maxLength: 30 }
        address: { type: string, maxLength: 255 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
    Vendor:
      type: object
      required: [id, userId, businessName, isActive]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        nif: { type: string, maxLength: 30 }
        businessName: { type: string, maxLength: 150 }
        phone: { type: string, maxLength: 30 }
        address: { type: string, maxLength: 255 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        isActive: { type: boolean }
    VendorWrite:
      type: object
      required: [businessName]
      properties:
        nif: { type: string, maxLength: 30 }
        businessName: { type: string, maxLength: 150 }
        phone: { type: string, maxLength: 30 }
        address: { type: string, maxLength: 255 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        isActive: { type: boolean }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 100 }
    CategoryWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    Tool:
      type: object
      required: [id, name, categoryId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 150 }
        description: { type: string }
        photoUrl: { type: string, format: uri }
        categoryId: { $ref: '#/components/schemas/Uuid' }
        category: { $ref: '#/components/schemas/Category' }
    ToolWrite:
      type: object
      required: [name, categoryId]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string }
        photoUrl: { type: string, format: uri }
        categoryId: { $ref: '#/components/schemas/Uuid' }
    ToolDetails:
      allOf:
        - $ref: '#/components/schemas/Tool'
        - type: object
          properties:
            inventory:
              type: array
              items: { $ref: '#/components/schemas/Inventory' }
    Inventory:
      type: object
      required: [id, stock, price, toolId, vendorId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        stock: { type: integer, minimum: 0 }
        price: { $ref: '#/components/schemas/Money' }
        toolId: { $ref: '#/components/schemas/Uuid' }
        vendorId: { $ref: '#/components/schemas/Uuid' }
        tool: { $ref: '#/components/schemas/Tool' }
        vendor: { $ref: '#/components/schemas/Vendor' }
    InventoryWrite:
      type: object
      required: [stock, price, toolId, vendorId]
      properties:
        stock: { type: integer, minimum: 0 }
        price: { $ref: '#/components/schemas/Money' }
        toolId: { $ref: '#/components/schemas/Uuid' }
        vendorId: { $ref: '#/components/schemas/Uuid' }
    RentalStatus:
      type: string
      enum: [pending, active, finished, cancelled]
    Rental:
      type: object
      required: [id, clientId, vendorId, startDate, endDate, status, totalAmount, depositAmount, items]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        clientId: { $ref: '#/components/schemas/Uuid' }
        vendorId: { $ref: '#/components/schemas/Uuid' }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/RentalStatus' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        depositAmount: { $ref: '#/components/schemas/Money' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RentalItem' }
        client: { $ref: '#/components/schemas/Client' }
        vendor: { $ref: '#/components/schemas/Vendor' }
    RentalCreate:
      type: object
      required: [vendorId, startDate, endDate, items]
      properties:
        vendorId: { $ref: '#/components/schemas/Uuid' }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        depositAmount: { $ref: '#/components/schemas/Money' }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [inventoryId]
            properties:
              inventoryId: { $ref: '#/components/schemas/Uuid' }
    RentalUpdate:
      type: object
      required: [vendorId, startDate, endDate, status, items]
      properties:
        vendorId: { $ref: '#/components/schemas/Uuid' }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/RentalStatus' }
        depositAmount: { $ref: '#/components/schemas/Money' }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [inventoryId]
            properties:
              inventoryId: { $ref: '#/components/schemas/Uuid' }
    RentalItem:
      type: object
      required: [id, rentalId, inventoryId, pricePerDay]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        rentalId: { $ref: '#/components/schemas/Uuid' }
        inventoryId: { $ref: '#/components/schemas/Uuid' }
        pricePerDay: { $ref: '#/components/schemas/Money' }
        inventory: { $ref: '#/components/schemas/Inventory' }
    RentalItemWrite:
      type: object
      required: [rentalId, inventoryId, pricePerDay]
      properties:
        rentalId: { $ref: '#/components/schemas/Uuid' }
        inventoryId: { $ref: '#/components/schemas/Uuid' }
        pricePerDay: { $ref: '#/components/schemas/Money' }
    Availability:
      type: object
      required: [inventoryId, available, availableStock]
      properties:
        inventoryId: { $ref: '#/components/schemas/Uuid' }
        available: { type: boolean }
        availableStock: { type: integer, minimum: 0 }
    PaymentType:
      type: string
      enum: [rental, deposit, refund]
    PaymentStatus:
      type: string
      enum: [pending, completed, failed]
    Payment:
      type: object
      required: [id, rentalId, amount, type, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        rentalId: { $ref: '#/components/schemas/Uuid' }
        amount: { $ref: '#/components/schemas/Money' }
        type: { $ref: '#/components/schemas/PaymentType' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        transactionId: { type: string, maxLength: 255 }
    PaymentCreate:
      type: object
      required: [rentalId, amount, type]
      properties:
        rentalId: { $ref: '#/components/schemas/Uuid' }
        amount: { $ref: '#/components/schemas/Money' }
        type: { $ref: '#/components/schemas/PaymentType' }
    PaymentUpdate:
      type: object
      required: [status]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        type: { $ref: '#/components/schemas/PaymentType' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        transactionId: { type: string, maxLength: 255 }
    Invoice:
      type: object
      required: [id, clientId, total, issuedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        clientId: { $ref: '#/components/schemas/Uuid' }
        rentalId: { $ref: '#/components/schemas/Uuid' }
        pdfUrl: { type: string, format: uri }
        total: { $ref: '#/components/schemas/Money' }
        issuedAt: { type: string, format: date-time }
    InvoiceCreate:
      type: object
      required: [clientId, total]
      properties:
        clientId: { $ref: '#/components/schemas/Uuid' }
        rentalId: { $ref: '#/components/schemas/Uuid' }
        pdfUrl: { type: string, format: uri }
        total: { $ref: '#/components/schemas/Money' }
    InvoiceUpdate:
      type: object
      required: [total]
      properties:
        rentalId: { $ref: '#/components/schemas/Uuid' }
        pdfUrl: { type: string, format: uri }
        total: { $ref: '#/components/schemas/Money' }
    RentalPhoto:
      type: object
      required: [id, rentalId, type, photoUrl, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        rentalId: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, enum: [delivery, return] }
        photoUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
    RentalPhotoWrite:
      type: object
      required: [type, photoUrl]
      properties:
        type: { type: string, enum: [delivery, return] }
        photoUrl: { type: string, format: uri }
    Pagination:
      type: object
      required: [page, pageSize, totalPages, totalItems]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
        totalItems: { type: integer }
    PaginatedTools:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ToolDetails' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PaginatedUsers:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/User' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PaginatedClients:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Client' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PaginatedInventory:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Inventory' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PaginatedVendors:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Vendor' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PaginatedRentals:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Rental' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PaginatedRentalItems:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RentalItem' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PaginatedPayments:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PaginatedInvoices:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
