        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoices'
    post:
      tags: [Invoices]
      summary: Create an invoice
      operationId: createInvoice
