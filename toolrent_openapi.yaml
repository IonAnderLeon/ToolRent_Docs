  /invoices/{invoiceId}:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    get:
      tags: [Invoices]
      summary: Get invoice metadata and PDF URL
      operationId: getInvoice
      responses:
        '200':
          description: Invoice
          content:
            application/json:
